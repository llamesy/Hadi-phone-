<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>My iPhone</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#17151d;color:white}.phone{max-width:430px;min-height:100dvh;margin:auto;position:relative;overflow:hidden;background:linear-gradient(145deg,#46365f,#c4779c 50%,#332b65)}.island{position:absolute;z-index:20;top:12px;left:50%;transform:translateX(-50%);background:#08080b;border-radius:24px;width:118px;height:32px}.status{display:flex;justify-content:space-between;padding:18px 26px 0;font-weight:650;font-size:15px;direction:ltr}.screen{padding:45px 22px 95px;min-height:calc(100dvh - 44px)}.lock{text-align:center;padding-top:60px}.lock .date{font-size:21px}.lock .clock{font-size:82px;letter-spacing:-5px;font-weight:200}.unlock{position:absolute;bottom:35px;left:0;width:100%;text-align:center;font-size:15px}.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:26px 12px;margin-top:22px}.app{text-align:center;cursor:pointer;font-size:12px}.ico{width:61px;height:61px;margin:0 auto 7px;border-radius:15px;background:#fff;display:grid;place-items:center;font-size:31px;color:#151515;box-shadow:0 3px 12px #0002}.dock{position:absolute;bottom:24px;left:5%;width:90%;background:#ffffff45;border-radius:26px;padding:14px;display:flex;justify-content:space-around}.dock .ico{margin:0}.topbar{display:flex;align-items:center;gap:12px;margin-bottom:22px}.back{border:0;border-radius:12px;background:#ffffff35;color:white;padding:10px;font-size:16px}.panel{background:#ffffffed;color:#171717;border-radius:20px;padding:17px;min-height:220px}.panel h2{margin-top:0}.item{padding:14px 4px;border-bottom:1px solid #ddd;cursor:pointer}.item:last-child{border:0}textarea,input,select{width:100%;font:inherit;border:1px solid #ddd;border-radius:10px;padding:11px;margin:5px 0 12px}textarea{min-height:110px}button{cursor:pointer}.primary{background:#087aff;color:white;border:0;border-radius:12px;padding:12px 18px}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.gallery img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:5px}.muted{color:#777;font-size:13px}.setting{margin-bottom:14px}.hidden{display:none}.hint{font-size:12px;color:#777}.file{display:block;padding:10px;border-bottom:1px solid #ddd;color:#007aff;text-decoration:none}.note{white-space:pre-wrap}.homebar{position:absolute;bottom:6px;left:36%;width:28%;height:5px;background:white;border-radius:10px;z-index:22}</style></head><body><div class="phone" id="phone"><div class="island"></div><div class="status"><span id="time">9:41</span><span>●●● ▰ 100%</span></div><main id="main" class="screen"></main><div class="homebar" onclick="goHome()"></div></div><script>
const defaults={wallpaper:'',name:'My iPhone',notes:['أهلًا في عالمي الصغير 💌'],chats:[{name:'Bestie 💗',messages:['هلااا','وينك؟ 😭']}],posts:['A little bit of everything 🫧'],calls:['مكالمة فائتة','Bestie'],files:[],photos:[],kick:['Welcome to my Kick 🎮']};let data;try{data={...defaults,...JSON.parse(localStorage.getItem('iphoneMimic')||'{}')}}catch{data={...defaults}};let page='lock';const main=document.getElementById('main'),phone=document.getElementById('phone');const save=()=>{localStorage.setItem('iphoneMimic',JSON.stringify(data));styleBg()};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function styleBg(){phone.style.background=data.wallpaper?`linear-gradient(#0002,#0005),url("${data.wallpaper}") center/cover`:'linear-gradient(145deg,#46365f,#c4779c 50%,#332b65)'}function clock(){document.getElementById('time').textContent=new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:false})}setInterval(clock,15000);clock();function openPage(p){page=p;render()}function goHome(){openPage('home')}function app(label,emoji,p,bg='#fff'){return `<div class="app" onclick="openPage('${p}')"><div class="ico" style="background:${bg}">${emoji}</div>${label}</div>`}function panel(title,html){return `<div class="topbar"><button class="back" onclick="goHome()">‹ الرئيسية</button><strong>${title}</strong></div><div class="panel">${html}</div>`}function listEdit(key,heading){return panel(heading,`<div id="entries">${data[key].map((v,i)=>`<div class="item" onclick="editEntry('${key}',${i})">${esc(typeof v==='string'?v:v.name)}</div>`).join('')}</div><button class="primary" onclick="editEntry('${key}',-1)">+ إضافة</button>`)}function editEntry(key,i){let old=data[key][i];if(key==='chats'){let name=prompt('اسم المحادثة',old?.name||'');if(name===null)return;let messages=prompt('الرسائل (كل رسالة بسطر)',old?.messages.join('\n')||'');if(messages===null)return;let val={name,messages:messages.split('\n')};i<0?data[key].push(val):data[key][i]=val}else{let val=prompt('اكتبي المحتوى',old||'');if(val===null)return;i<0?data[key].push(val):data[key][i]=val}save();render()}function render(){styleBg();if(page==='lock'){let d=new Date();main.innerHTML=`<div class="lock"><div class="date">${d.toLocaleDateString('ar-SA',{weekday:'long',month:'long',day:'numeric'})}</div><div class="clock">${d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:false})}</div><div style="margin-top:100px">🔒</div></div><div class="unlock" onclick="goHome()">اسحبي للأعلى للفتح ↑<br><span class="hint" style="color:white">اضغطي هنا</span></div>`;return}if(page==='home'){main.innerHTML=`<div style="text-align:center;margin:5px 0 30px;font-size:20px">${esc(data.name)} ✨</div><div class="apps">${app('الصور','🌄','photos')}${app('واتساب','💬','chats','#3bdb6d')}${app('الملفات','📁','files')}${app('الهاتف','📞','calls','#45d05d')}${app('الملاحظات','📝','notes','#fff2aa')}${app('إكس','𝕏','posts','#111')}${app('كيك','🎮','kick','#53fc18')}${app('الإعدادات','⚙️','settings','#ddd')}</div><div class="dock">${app('','📞','calls','#45d05d')}${app('','💬','chats','#3bdb6d')}${app('','🌄','photos')}${app('','⚙️','settings','#ddd')}</div>`;return}if(page==='photos'){main.innerHTML=panel('الصور',`<h2>المكتبة</h2><div class="gallery">${data.photos.map((p,i)=>`<img src="${p}" onclick="photoDetail(${i})">`).join('')}</div><p class="muted">${data.photos.length} صورة</p><input type="file" id="photoUpload" accept="image/*" multiple onchange="uploadPhotos(this.files)"><p class="hint">الصور تُحفظ على جهازك الحالي فقط. استخدمي صورًا صغيرة حتى لا تمتلئ مساحة التخزين.</p>`);return}if(page==='chats'){main.innerHTML=panel('WhatsApp',`<h2>الدردشات</h2>${data.chats.map((c,i)=>`<div class="item" onclick="chatDetail(${i})">🟢 ${esc(c.name)}<div class="muted">${esc(c.messages.at(-1)||'')}</div></div>`).join('')}<button class="primary" onclick="editEntry('chats',-1)">+ محادثة</button>`);return}if(page==='settings'){main.innerHTML=panel('الإعدادات',`<h2>تخصيص الجوال</h2><div class="setting">اسم الجوال<input id="phoneName" value="${esc(data.name)}"></div><div class="setting">خلفية شاشة القفل والرئيسية<input type="file" accept="image/*" onchange="uploadWallpaper(this.files[0])"></div><button class="primary" onclick="data.name=document.getElementById('phoneName').value;save();goHome()">حفظ التغييرات</button><hr><p class="muted">المحتوى الحالي محفوظ داخل متصفحك فقط، ولن يظهر لزوار الموقع المنشور تلقائيًا.</p><button class="primary" onclick="exportData()">تصدير المحتوى JSON</button><input type="file" accept="application/json" onchange="importData(this.files[0])"><p class="hint">لتعديل المحتوى الذي يراه الجميع، صدّري البيانات وأضيفيها للمشروع قبل نشره.</p>`);return}if(page==='files'){main.innerHTML=panel('الملفات',`<h2>على الـ iPhone</h2>${data.files.map((f,i)=>`<a class="file" href="${f.data}" download="${esc(f.name)}">📄 ${esc(f.name)}</a>`).join('')}<input type="file" multiple onchange="uploadFiles(this.files)">`);return}if(page==='calls'){main.innerHTML=listEdit('calls','الهاتف');return}if(page==='notes'){main.innerHTML=listEdit('notes','الملاحظات');return}if(page==='posts'){main.innerHTML=listEdit('posts','𝕏');return}if(page==='kick'){main.innerHTML=listEdit('kick','Kick');return}}function chatDetail(i){let c=data.chats[i];main.innerHTML=panel(esc(c.name),`${c.messages.map((m,j)=>`<div style="background:${j%2?'#d9fdd3':'#eee'};padding:12px;margin:10px 0;border-radius:12px">${esc(m)}</div>`).join('')}<button class="primary" onclick="editEntry('chats',${i})">تعديل المحادثة</button>`)}function photoDetail(i){main.innerHTML=panel('الصورة',`<img src="${data.photos[i]}" style="width:100%;border-radius:12px"><button class="primary" onclick="data.photos.splice(${i},1);save();render()">حذف الصورة</button>`)}function readFile(f){return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}async function uploadPhotos(files){for(let f of files){if(f.size>900000){alert('اختاري صورة أصغر من 900KB');continue}data.photos.push(await readFile(f))}try{save()}catch{alert('مساحة التخزين ممتلئة؛ قللي الصور')}render()}async function uploadWallpaper(f){if(!f)return;if(f.size>1500000){alert('اختاري صورة أصغر من 1.5MB');return}data.wallpaper=await readFile(f);try{save()}catch{alert('الصورة كبيرة جدًا')}render()}async function uploadFiles(files){for(let f of files){if(f.size>600000){alert('اختاري ملفًا أصغر من 600KB');continue}data.files.push({name:f.name,data:await readFile(f)})}try{save()}catch{alert('مساحة التخزين ممتلئة')}render()}function exportData(){let blob=new Blob([JSON.stringify(data)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='iphone-content.json';a.click();URL.revokeObjectURL(a.href)}async function importData(f){if(!f)return;try{let x=JSON.parse(await f.text());data={...defaults,...x};save();render()}catch{alert('ملف غير صالح')}}render();</script></body></html>
